title: Static Web Page Modification by Non-Webserver Process (AN0662-A)
id: e0779e7c-fa9c-4d61-9110-002699546adf
status: experimental
description: Detects modifications of HTML/JS/CSS files in standard web roots by processes other than IIS, Apache, Nginx, or administrative editors.
author: Krishna Gupta
date: 2026-06-30
logsource:
    category: file_event
    product: windows
detection:
    selection_web_paths:
        TargetFilename|contains:
            - '\inetpub\wwwroot\'
            - '\apache\htdocs\'
            - '\nginx\html\'
            - '\tomcat\webapps\'
    selection_extensions:
        TargetFilename|endswith:
            - '.html'
            - '.htm'
            - '.js'
            - '.css'
    filter_webservers:
        Image|endswith:
            - '\w3wp.exe'
            - '\httpd.exe'
            - '\nginx.exe'
            - '\tomcat.exe'
            - '\msdeploy.exe'
    filter_editors:
        Image|endswith:
            - '\notepad.exe'
            - '\code.exe'
            - '\explorer.exe'
    filter_deployment:
        ParentImage|endswith:
            - '\msdeploy.exe'
            - '\git.exe'
            - '\svn.exe'
    condition: selection_web_paths and selection_extensions and not (filter_webservers or filter_editors or filter_deployment)
fields:
    - TargetFilename
    - Image
    - User
falsepositives:
    - Internal deployment tools or custom scripting frameworks updating web assets legitimately.
level: medium
tags:
    - attack.impact
    - attack.t1491
    - analytic.an0662
    - detection.det0238
