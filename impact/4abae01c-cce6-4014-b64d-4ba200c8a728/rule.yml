title: File Wiping or Volume Shadow Copy Deletion via PowerShell Script Block (AN0411-B)
id: 755ca4c1-1f80-4e31-815b-22cdf3b6cae6
status: experimental
description: Detects PowerShell script block logs containing commands attempting to delete, disable, or resize Volume Shadow Copies.
author: Krishna Gupta
date: 2026-06-16
logsource:
    category: ps_script
    product: windows
detection:
    selection_keywords:
        ScriptBlockText|contains:
            - 'Win32_ShadowCopy'
            - 'delete shadows'
            - 'shadowcopy delete'
            - 'vssadmin'
            - 'sdelete'
            - 'cipher'
    condition: selection_keywords
fields:
    - ScriptBlockText
falsepositives:
    - Legitimate administrative scripting for backup management.
level: high
tags:
    - attack.impact
    - attack.t1485
    - analytic.an0411
    - detection.det0146
