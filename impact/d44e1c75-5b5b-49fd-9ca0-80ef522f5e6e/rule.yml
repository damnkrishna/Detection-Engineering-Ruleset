title: Scheduled Task Creation for Mining Tasks (AN1489-B)
id: 162bc204-1f70-455e-a764-e350418b7ba4
status: experimental
description: Detects CLI scheduling of tasks containing miner parameters or stratum pool configurations.
author: Krishna Gupta
date: 2026-06-30
logsource:
    category: process_creation
    product: windows
detection:
    selection_images:
        Image|endswith:
            - '\schtasks.exe'
    selection_args:
        CommandLine|contains:
            - ' /create '
            - ' -create '
    selection_miner_args:
        CommandLine|contains:
            - 'stratum'
            - 'xmrig'
            - 'minerd'
            - 'pool'
    condition: selection_images and selection_args and selection_miner_args
fields:
    - Image
    - CommandLine
    - User
falsepositives:
    - Authorized admin tasks scheduling compute testing routines (rare in production).
level: high
tags:
    - attack.impact
    - attack.t1496.001
    - analytic.an1489
    - detection.det0540
