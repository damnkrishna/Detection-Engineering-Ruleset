title: Network Flooding Tools Execution (AN0969-A)
id: 1801ef84-102e-46fe-85d8-8e7f4881c1fb
status: experimental
description: Detects command-line execution of known network flooding utilities (e.g. LOIC, HOIC, hping3).
author: Krishna Gupta
date: 2026-06-30
logsource:
    category: process_creation
    product: windows
detection:
    selection_images:
        Image|endswith:
            - '\loic.exe'
            - '\hoic.exe'
            - '\hping3.exe'
            - '\nping.exe'
            - '\ufonet.exe'
        OriginalFileName:
            - 'loic.exe'
            - 'hoic.exe'
            - 'hping3.exe'
            - 'nping.exe'
            - 'ufonet.exe'
    selection_cli:
        CommandLine|contains:
            - 'loic'
            - 'hoic'
            - 'hping3'
            - 'nping'
            - 'synflood'
    condition: selection_images or selection_cli
fields:
    - Image
    - OriginalFileName
    - CommandLine
    - User
falsepositives:
    - Security teams conducting authorized load testing or network stress tests.
level: high
tags:
    - attack.impact
    - attack.t1498.001
    - analytic.an0969
    - detection.det0343
