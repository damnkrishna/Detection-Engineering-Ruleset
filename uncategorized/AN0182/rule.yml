title: PowerShell Silent Error Suppression for Evasion (AN0182-A)
id: d11c7e85-9b25-41be-a73d-7185b940268b
status: experimental
description: Detects PowerShell execution with error action preference set to SilentlyContinue or Ignore in script block logs, used by adversaries to suppress error output and execute commands without alerting users or detection tools.
author: Krishna Gupta
date: 2026-06-07
logsource:
    category: ps_script
    product: windows
    # Relies on PowerShell Script Block Logging (Event ID 4104)
detection:
    selection_silence:
        ScriptBlockText|contains:
            - '-ErrorAction SilentlyContinue'
            - '-EA SilentlyContinue'
            - '$ErrorActionPreference = ''SilentlyContinue'''
            - '$ErrorActionPreference = "SilentlyContinue"'
            - '-ErrorAction Ignore'
            - '$ErrorActionPreference = ''Ignore'''
            - 'SilentlyContinue'
    selection_combined_with_execution:
        ScriptBlockText|contains:
            - 'Invoke-Expression'
            - 'IEX'
            - 'DownloadString'
            - 'WebClient'
            - 'Start-Process'
            - 'Invoke-Command'
    condition: selection_silence and selection_combined_with_execution
fields:
    - ScriptBlockText
falsepositives:
    - Legitimate administrative automation scripts that use SilentlyContinue to gracefully handle expected failures.
level: medium
tags:
    - attack.defense-evasion
    - attack.t1564.011
    - analytic.an0182
    - detection.det0067
