title: Potential Endpoint Service Exhaustion Flood Tool Execution via CLI (AN0489-A)
id: 2b269224-dc89-4963-b6d4-9c19de40b116
status: experimental
description: Detects the execution of known load testing or HTTP flooding utilities (like ab.exe or slowhttptest) or scripting engines running parameters indicative of a service exhaustion flood.
author: Krishna Gupta
date: 2026-06-07
logsource:
    category: process_creation
    product: windows
detection:
    selection_tools:
        - Image|endswith:
            - '\ab.exe'
            - '\slowhttptest.exe'
            - '\hping3.exe'
        - OriginalFileName:
            - 'ab.exe'
            - 'slowhttptest.exe'
            - 'hping3.exe'
    selection_scripts:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
    selection_script_loop:
        CommandLine|contains:
            - 'while($true)'
            - 'while(1)'
            - 'for /l'
    selection_script_cmd:
        CommandLine|contains:
            - 'Invoke-WebRequest'
            - 'Invoke-RestMethod'
            - 'curl'
            - 'wget'
    filter_installer:
        ParentImage|endswith:
            - '\msiexec.exe'
            - '\setup.exe'
    condition: (selection_tools or (selection_scripts and selection_script_loop and selection_script_cmd)) and not filter_installer
fields:
    - Image
    - OriginalFileName
    - CommandLine
    - ParentImage
    - ParentCommandLine
    - CurrentDirectory
    - User
    - LogonId
falsepositives:
    - Authorized application load testing conducted by QA teams or web developers within testing subnets.
level: medium
tags:
    - attack.impact
    - attack.t1499.002
    - analytic.an0489
    - detection.det0173
