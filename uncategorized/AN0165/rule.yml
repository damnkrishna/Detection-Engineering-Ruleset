title: Ingress Tool Transfer via PowerShell Script Block (AN0165-B)
id: 800c3a8a-050b-4232-81c5-47fd2c2c5f85
status: experimental
description: Detects PowerShell script blocks invoking file download methods or cmdlets (DownloadFile, DownloadString, Invoke-WebRequest) to download external files.
author: Krishna Gupta
date: 2026-06-08
logsource:
    category: ps_script
    product: windows
    # Relies on PowerShell Script Block Logging (Event ID 4104)
detection:
    selection_keywords:
        ScriptBlockText|contains:
            - 'DownloadFile'
            - 'DownloadString'
            - 'Invoke-WebRequest'
            - 'Net.WebClient'
            - 'Start-BitsTransfer'
    condition: selection_keywords
fields:
    - ScriptBlockText
falsepositives:
    - Legitimate administrative or provisioning scripts downloading tools/updates.
level: high
tags:
    - attack.command-and-control
    - attack.t1105
    - analytic.an0165
    - detection.det0060
---
title: Ingress Tool Transfer Network Connection (AN0165-C)
id: 4127cce9-13b5-4023-a50a-af16d634f4ca
status: experimental
description: Detects outbound network connections initiated by common command line download tools (certutil, bitsadmin, curl, wget, PowerShell) to remote web ports, indicating active ingress downloads.
author: Krishna Gupta
date: 2026-06-08
logsource:
    category: network_connection
    product: windows
    # Relies on Sysmon Event ID 3
detection:
    selection_process:
        Image|endswith:
            - '\certutil.exe'
            - '\bitsadmin.exe'
            - '\curl.exe'
            - '\wget.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_ports:
        DestinationPort:
            - 80
            - 443
            - 8080
    condition: selection_process and selection_ports
fields:
    - Image
    - CommandLine
    - User
    - DestinationHostname
    - DestinationIp
    - DestinationPort
    - Initiated
    - SourceIp
falsepositives:
    - Legitimate administrative operations downloading files from internal/external servers.
level: high
tags:
    - attack.command-and-control
    - attack.t1105
    - analytic.an0165
    - detection.det0060
