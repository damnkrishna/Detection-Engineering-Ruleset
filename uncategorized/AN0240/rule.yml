title: Backup Software Discovery via CLI (AN0240-A)
id: cbee02be-2958-4558-81bc-f22a91369eca
status: experimental
description: Detects adversarial execution of service queries, registry reads, or WMI commands targeting known backup product names (Veeam, Acronis, Windows Backup, ShadowProtect).
author: Krishna Gupta
date: 2026-06-07
logsource:
    category: process_creation
    product: windows
    # Relies on Sysmon Event ID 1
detection:
    selection_sc:
        - Image|endswith: '\sc.exe'
        - OriginalFileName: 'sc.exe'
    selection_sc_backup:
        CommandLine|contains:
            - 'VeeamBackup'
            - 'AcrSch2Svc'
            - 'WBENGINE'
            - 'BackupExecAgentAccelerator'
            - 'ShadowProtect'
            - 'vss'
    selection_reg:
        - Image|endswith: '\reg.exe'
        - OriginalFileName: 'reg.exe'
    selection_reg_backup:
        CommandLine|contains:
            - '\Veeam'
            - '\Acronis'
            - '\CrashPlan'
            - '\BackupExec'
            - '\ShadowProtect'
            - '\WindowsImageBackup'
    selection_wmic:
        - Image|endswith: '\wmic.exe'
        - OriginalFileName: 'wmic.exe'
    selection_wmic_backup:
        CommandLine|contains:
            - 'Veeam'
            - 'Acronis'
            - 'BackupExec'
    selection_powershell:
        - Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        - OriginalFileName:
            - 'PowerShell.EXE'
            - 'pwsh.dll'
    selection_powershell_backup:
        CommandLine|contains:
            - 'Veeam'
            - 'Acronis'
            - 'BackupExec'
            - 'ShadowProtect'
            - 'WindowsServerBackup'
            - 'wbadmin'
    filter_installer:
        ParentImage|endswith:
            - '\msiexec.exe'
            - '\setup.exe'
        ParentCommandLine|contains:
            - ' /i '
            - ' -i '
            - ' /install '
            - ' -install '
    condition: ((selection_sc and selection_sc_backup) or (selection_reg and selection_reg_backup) or (selection_wmic and selection_wmic_backup) or (selection_powershell and selection_powershell_backup)) and not filter_installer
fields:
    - Image
    - OriginalFileName
    - CommandLine
    - ParentImage
    - ParentCommandLine
    - CurrentDirectory
    - User
    - LogonId
falsepositives:
    - Backup administrators checking backup software status, or deployment scripts verifying backup agent installation during provisioning.
level: high
tags:
    - attack.discovery
    - attack.t1518.002
    - analytic.an0240
    - detection.det0088
