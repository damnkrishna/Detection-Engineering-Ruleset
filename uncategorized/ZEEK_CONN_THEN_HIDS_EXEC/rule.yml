{
  "id": "ZEEK_CONN_THEN_HIDS_EXEC",
  "description": "Zeek detects suspicious network flow, HIDS detects execution on same entity \u2014 cross-sensor confirmation",
  "correlationKey": "entityIp",
  "scoreMultiplier": 2.5,
  "windowMinutes": 30,
  "sensorFilter": [
    "ZEEK",
    "HIDS"
  ],
  "stages": [
    {
      "label": "suspicious_flow",
      "signatureContains": [
        "zeek_conn",
        "zeek_flow",
        "suspicious connection",
        "unusual port",
        "long conn",
        "data transfer"
      ],
      "optional": false,
      "maxGapSeconds": 600
    },
    {
      "label": "local_exec",
      "optional": false,
      "conditions": [
        {
          "field": "tactic",
          "op": "IN",
          "values": [
            "TA0002",
            "TA0003"
          ]
        }
      ],
      "maxGapSeconds": 600
    }
  ]
}
