{
  "id": "DNS_QUERY_RATE_SPIKE",
  "description": "Abnormal DNS query volume from single host in 5 minutes \u2014 DGA C2 characteristic or DNS tunneling (T1568, T1071.004). Behavior-driven, no signature required.",
  "correlationKey": "entityIp",
  "scoreMultiplier": 2.5,
  "windowMinutes": 5,
  "sensorFilter": [
    "ZEEK",
    "NIDS"
  ],
  "stages": [
    {
      "label": "dns_flood",
      "conditions": [
        {
          "field": "tactic",
          "op": "IN",
          "values": [
            "TA0011",
            "TA0010",
            "TA0043"
          ]
        }
      ],
      "signatureContains": [
        "dns_query",
        "DNS query",
        "NXDOMAIN",
        "non-existent domain",
        "dga",
        "random subdomain",
        "high frequency dns",
        "dns spike"
      ],
      "optional": false,
      "minOccurrences": 20
    }
  ]
}
