title: Registry Persistence Key Deletion (AN0113-B)
id: 8b0dd54a-cc56-46c6-83bb-af7da048d75b
status: experimental
description: Detects deletion of registry values under standard persistence paths (Run, RunOnce, Services) which indicates cleanup of malicious persistence mechanisms.
author: Krishna Gupta
date: 2026-06-08
logsource:
    category: registry_set
    product: windows
    # Relies on Sysmon Event ID 12/13
detection:
    selection_path:
        TargetObject|contains:
            - '\SOFTWARE\Microsoft\Windows\CurrentVersion\Run\'
            - '\SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnce\'
            - '\System\CurrentControlSet\Services\'
    selection_delete:
        EventType: 'DeleteValue'
    filter_system:
        Image|endswith:
            - '\msiexec.exe'
            - '\setup.exe'
    condition: selection_path and selection_delete and not filter_system
fields:
    - Image
    - TargetObject
    - EventType
    - User
falsepositives:
    - Legitimate application uninstallers cleaning up their startup registry keys or services.
level: medium
tags:
    - attack.defense-evasion
    - attack.t1070.009
    - analytic.an0113
    - detection.det0040
---
title: Scheduled Task Deletion via Security Logs (AN0113-C)
id: fd526409-61ae-4e5f-b16f-d4a4adf17191
status: experimental
description: Detects the deletion of scheduled tasks by monitoring Windows Security Event ID 4699, which is common during post-exploit cleanup activities.
author: Krishna Gupta
date: 2026-06-08
logsource:
    service: security
    product: windows
    # Relies on Windows Security Event ID 4699
detection:
    selection_eid:
        EventID: 4699
    filter_system:
        SubjectUserName|endswith: '$'
    condition: selection_eid and not filter_system
fields:
    - EventID
    - TaskName
    - SubjectUserName
    - SubjectUserSid
falsepositives:
    - Legitimate software uninstallation deleting its scheduled tasks.
level: medium
tags:
    - attack.defense-evasion
    - attack.t1070.009
    - analytic.an0113
    - detection.det0040
