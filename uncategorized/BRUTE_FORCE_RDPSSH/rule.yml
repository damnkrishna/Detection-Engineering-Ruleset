{
  "id": "BRUTE_FORCE_RDPSSH",
  "description": "Brute force against RDP/SSH/VPN followed by successful authentication",
  "correlationKey": "username",
  "scoreMultiplier": 2.5,
  "windowMinutes": 60,
  "sensorFilter": [
    "NIDS",
    "HIDS"
  ],
  "stages": [
    {
      "label": "failures",
      "optional": false,
      "minOccurrences": 3,
      "signatureEquals": [
        "RDP brute",
        "SSH brute",
        "authentication failed",
        "4625",
        "invalid user",
        "failed password",
        "login failed",
        "brute force"
      ]
    },
    {
      "label": "success",
      "optional": false,
      "maxGapSeconds": 3600,
      "signatureEquals": [
        "4624",
        "accepted password",
        "session opened",
        "logon success",
        "remote desktop",
        "successful login"
      ]
    }
  ]
}
