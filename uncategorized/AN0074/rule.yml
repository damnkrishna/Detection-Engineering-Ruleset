title: Custom Print Processor Installation via CLI (AN0074)
id: 1520eb28-fb6a-45a2-8aac-8780a4778fd6
status: experimental
description: Detects command-line registry modifications adding custom print processors under the Windows spooler environment registry path, which can be abused for privilege escalation and persistence.
author: Krishna Gupta
date: 2026-06-07
logsource:
    category: process_creation
    product: windows
detection:
    selection_cmd:
        CommandLine|contains:
            - 'Control\Print\Environments\'
        CommandLine|contains:
            - 'Print Processors'
        CommandLine|contains:
            - 'reg'
            - 'add'
            - 'Set-ItemProperty'
            - 'New-ItemProperty'
    condition: selection_cmd
fields:
    - Image
    - OriginalFileName
    - CommandLine
    - ParentImage
    - ParentCommandLine
    - CurrentDirectory
    - User
    - LogonId
falsepositives:
    - Legitimate printer drivers or software installer configuring spoolers.
level: high
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1547.012
    - analytic.an0074
    - detection.det0029
