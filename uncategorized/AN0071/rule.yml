title: Electron Application Abuse for Proxy Execution (AN0071-A)
id: 99f83bd8-1f56-4875-ab16-98d3b03bb041
status: experimental
description: Detects abuse of trusted Electron applications (Teams, Slack, VS Code, Discord) via malicious command-line flags (--gpu-launcher, --inspect) or spawning of unexpected child shell processes.
author: Krishna Gupta
date: 2026-06-07
logsource:
    category: process_creation
    product: windows
    # Relies on Sysmon Event ID 1
detection:
    selection_electron_flags:
        Image|contains:
            - '\Microsoft\Teams\current\Teams.exe'
            - '\Slack\slack.exe'
            - '\Microsoft VS Code\Code.exe'
            - '\Discord\Discord.exe'
        CommandLine|contains:
            - '--gpu-launcher'
            - '--renderer-startup-dialog'
            - '--inspect='
            - '--inspect-brk='
            - '--no-sandbox'
    selection_electron_child:
        ParentImage|contains:
            - '\Microsoft\Teams\current\Teams.exe'
            - '\Slack\slack.exe'
            - '\Microsoft VS Code\Code.exe'
            - '\Discord\Discord.exe'
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\mshta.exe'
            - '\rundll32.exe'
    filter_installer:
        ParentImage|endswith:
            - '\msiexec.exe'
            - '\setup.exe'
    condition: (selection_electron_flags or selection_electron_child) and not filter_installer
fields:
    - Image
    - OriginalFileName
    - CommandLine
    - ParentImage
    - ParentCommandLine
    - CurrentDirectory
    - User
    - LogonId
falsepositives:
    - Developer workflows using VS Code with --inspect for debugging Node.js apps, or Electron app updates that spawn installer child processes.
level: high
tags:
    - attack.defense-evasion
    - attack.t1218.015
    - analytic.an0071
    - detection.det0025
