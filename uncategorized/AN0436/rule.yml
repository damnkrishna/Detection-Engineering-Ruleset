title: Webhook Exfiltration Command Execution (AN0436-B)
id: 6d06869a-b062-4500-9afd-05239df4c12a
status: experimental
description: Detects CLI tools or scripting engines executing commands that target known webhook domains, suggesting potential scripted data exfiltration.
author: Krishna Gupta
date: 2026-06-17
logsource:
    category: process_creation
    product: windows
detection:
    selection_process_image:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\curl.exe'
    selection_process_original:
        OriginalFileName:
            - 'PowerShell.EXE'
            - 'pwsh.dll'
            - 'cmd.exe'
            - 'wscript.exe'
            - 'cscript.exe'
            - 'curl.exe'
    selection_args:
        CommandLine|contains:
            - 'webhook.site'
            - 'hooks.slack.com'
            - 'discord.com'
            - 'discordapp.com'
    condition: (selection_process_image or selection_process_original) and selection_args
fields:
    - Image
    - OriginalFileName
    - CommandLine
    - User
falsepositives:
    - Standard administrative tasks or automation scripts updating notifications.
level: high
tags:
    - attack.exfiltration
    - attack.t1567.004
    - analytic.an0436
    - detection.det0153
