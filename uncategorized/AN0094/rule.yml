title: Accessibility Features Abuse Detection (AN0094)
id: 8f996219-2107-493a-9caf-d82a92545e1f
status: experimental
description: Detects command-line execution of registry commands setting debugger options for accessibility binaries (like sethc.exe or utilman.exe), or detects accessibility applications launching shell interpreters.
author: Krishna Gupta
date: 2026-06-07
logsource:
    category: process_creation
    product: windows
detection:
    selection_parent:
        ParentImage|endswith:
            - '\sethc.exe'
            - '\utilman.exe'
            - '\osk.exe'
            - '\magnify.exe'
            - '\narrator.exe'
            - '\displayswitch.exe'
            - '\AtBroker.exe'
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_ifeo:
        CommandLine|contains:
            - 'Image File Execution Options'
        CommandLine|contains:
            - 'debugger'
        CommandLine|contains:
            - 'sethc.exe'
            - 'utilman.exe'
            - 'osk.exe'
            - 'magnify.exe'
            - 'narrator.exe'
            - 'displayswitch.exe'
            - 'AtBroker.exe'
    condition: selection_parent or selection_ifeo
fields:
    - Image
    - OriginalFileName
    - CommandLine
    - ParentImage
    - ParentCommandLine
    - CurrentDirectory
    - User
    - LogonId
falsepositives:
    - Highly unlikely. Shell execution by accessibility features is not normal.
level: critical
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1546.008
    - analytic.an0094
    - detection.det0042
