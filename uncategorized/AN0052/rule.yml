title: Loading of Suspicious DLL from User-Writable Directory (AN0052)
id: ca57eb80-62df-46a3-952b-f13071633f66
status: experimental
description: Detects a process loading a shared module (DLL) located in user-writable directories (like AppData, Temp, or Public), which may indicate DLL side-loading or search order hijacking.
author: Krishna Gupta
date: 2026-06-07
logsource:
    category: image_load
    product: windows
    # Relies on Sysmon Event ID 7
detection:
    selection_paths:
        ImageLoaded|contains:
            - '\AppData\Local\Temp\'
            - '\Users\Public\'
            - '\Windows\Temp\'
            - '\AppData\Roaming\'
    selection_processes:
        Image|endswith:
            - '\explorer.exe'
            - '\svchost.exe'
            - '\cmd.exe'
            - '\powershell.exe'
            - '\rundll32.exe'
            - '\regsvr32.exe'
            - '\mshta.exe'
    selection_signature:
        Signed: 'false'
    condition: selection_paths and selection_processes and selection_signature
fields:
    - Image
    - ImageLoaded
    - Signed
    - SignatureStatus
falsepositives:
    - Legitimate software installed in user directories (like local profile applications) loading local DLLs.
level: high
tags:
    - attack.execution
    - attack.t1129
    - analytic.an0052
    - detection.det0018
