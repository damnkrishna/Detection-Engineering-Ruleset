title: Installation of Root Certificate via CLI (AN0153)
id: 56d4b2a1-e3d9-4c2a-a87a-dd2cf2ad06b6
status: experimental
description: Detects command-line execution of certutil.exe, certmgr.exe, or PowerShell cmdlets adding a certificate to the local Trusted Root Certification Authorities store.
author: Krishna Gupta
date: 2026-06-07
logsource:
    category: process_creation
    product: windows
    # Relies on Sysmon Event ID 1
detection:
    selection_certutil:
        - Image|endswith: '\certutil.exe'
        - OriginalFileName: 'CertUtil.exe'
    selection_certutil_args:
        CommandLine|contains|all:
            - '-addstore'
            - 'root'
    selection_certmgr:
        - Image|endswith: '\certmgr.exe'
        - OriginalFileName: 'certmgr.exe'
    selection_certmgr_args:
        CommandLine|contains|all:
            - '/add'
            - 'root'
    selection_powershell:
        - Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        - OriginalFileName:
            - 'PowerShell.EXE'
            - 'pwsh.dll'
    selection_powershell_cmdlets:
        CommandLine|contains|all:
            - 'Import-Certificate'
            - 'Root'
    condition: (selection_certutil and selection_certutil_args) or (selection_certmgr and selection_certmgr_args) or (selection_powershell and selection_powershell_cmdlets)
fields:
    - Image
    - OriginalFileName
    - CommandLine
    - ParentImage
    - ParentCommandLine
    - CurrentDirectory
    - User
    - LogonId
falsepositives:
    - Internal IT administrator scripts deployed to distribute enterprise PKI root certificates.
    - Security agent or VPN installations that require installing custom root certificates.
level: high
tags:
    - attack.defense-evasion
    - attack.t1553.004
    - analytic.an0153
    - detection.det0056
---
title: Installation of Root Certificate via Registry (AN0153-B)
id: eeb6110f-1750-4300-a6f9-7a3655129cb1
status: experimental
description: Detects registry modifications under system certificate store paths indicating the installation of a custom root certificate.
author: Krishna Gupta
date: 2026-06-17
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|contains:
            - '\SOFTWARE\Microsoft\SystemCertificates\Root\Certificates\'
            - '\SOFTWARE\Microsoft\SystemCertificates\AuthRoot\Certificates\'
            - '\SOFTWARE\Microsoft\SystemCertificates\CA\Certificates\'
    condition: selection
fields:
    - TargetObject
    - Details
    - Image
    - User
falsepositives:
    - Legitimate system updates or domain group policies installing root certificates automatically.
level: high
tags:
    - attack.defense-evasion
    - attack.t1553.004
    - analytic.an0153
    - detection.det0056
