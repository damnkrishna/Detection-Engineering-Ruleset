title: Stopping or Disabling Critical System Services via CLI (AN0061-A)
id: 56c67b7c-e085-46e8-81b8-4c63a01812b3
status: experimental
description: Detects command-line execution of sc.exe, net.exe, or net1.exe stopping or disabling critical system services (e.g. anti-virus, firewalls, databases).
author: Krishna Gupta
date: 2026-06-07
logsource:
    category: process_creation
    product: windows
detection:
    selection_tools:
        - Image|endswith:
            - '\sc.exe'
            - '\net.exe'
            - '\net1.exe'
        - OriginalFileName:
            - 'sc.exe'
            - 'net.exe'
            - 'net1.exe'
    selection_action:
        CommandLine|contains:
            - 'stop'
            - 'config'
    selection_services:
        CommandLine|contains:
            - 'WinDefend'
            - 'MpsSvc'
            - 'Sentinel'
            - 'Wazuh'
            - 'Sysmon'
            - 'CarbonBlack'
            - 'CrowdStrike'
            - 'Sophos'
            - 'MSExchange'
            - 'MSSQL'
            - 'disable'
    filter_installer:
        ParentImage|endswith:
            - '\msiexec.exe'
            - '\setup.exe'
    condition: selection_tools and selection_action and selection_services and not filter_installer
fields:
    - Image
    - OriginalFileName
    - CommandLine
    - ParentImage
    - ParentCommandLine
    - CurrentDirectory
    - User
    - LogonId
falsepositives:
    - IT administration tasks during database upgrades, security agent updates, or system troubleshooting.
level: high
tags:
    - attack.impact
    - attack.t1489
    - analytic.an0061
    - detection.det0021
