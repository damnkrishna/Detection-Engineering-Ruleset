title: Network Packet Capture Tool Execution (AN2093)
id: d6fc979d-aed8-463b-9727-4b90fa6cb6c0
status: experimental
description: Detects the execution of network packet capture binaries such as tshark, windump, or tcpdump on a Windows host, indicating potential credential harvesting or network reconnaissance.
author: Krishna Gupta
date: 2026-07-01
logsource:
    category: process_creation
    product: windows
detection:
    selection_images:
        Image|endswith:
            - '\tshark.exe'
            - '\windump.exe'
            - '\tcpdump.exe'
            - '\rawcap.exe'
            - '\pktmon.exe'
    selection_ofn:
        OriginalFileName:
            - 'tshark.exe'
            - 'windump.exe'
            - 'tcpdump.exe'
            - 'rawcap.exe'
            - 'PktMon.exe'
    condition: selection_images or selection_ofn
fields:
    - Image
    - OriginalFileName
    - CommandLine
    - User
falsepositives:
    - Network engineers or security analysts running authorized packet captures for diagnostics.
level: high
tags:
    - attack.credential_access
    - attack.discovery
    - attack.t1040
    - analytic.an2093
    - detection.det0950
