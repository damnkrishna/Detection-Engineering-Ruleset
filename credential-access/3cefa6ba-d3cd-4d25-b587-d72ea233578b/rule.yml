title: Suspicious LSA Authentication Package Modification via CLI (AN0287-B)
id: 26a53ec7-0eb5-4324-9da0-9357a3d74323
status: experimental
description: Detects command-line reg.exe operations targeting LSA keys to add or modify authentication/notification packages.
author: Krishna Gupta
date: 2026-06-16
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: '\reg.exe'
        - OriginalFileName: 'reg.exe'
    selection_path:
        CommandLine|contains:
            - '\Control\Lsa'
    selection_keys:
        CommandLine|contains:
            - 'Authentication Packages'
            - 'Notification Packages'
            - 'Security Packages'
    condition: selection_img and selection_path and selection_keys
fields:
    - Image
    - OriginalFileName
    - CommandLine
    - ParentImage
    - User
falsepositives:
    - Legitimate administrative scripting during IAM setup.
level: critical
tags:
    - attack.credential-access
    - attack.defense-evasion
    - attack.persistence
    - attack.t1556
    - attack.t1556.002
    - analytic.an0287
    - detection.det0104
