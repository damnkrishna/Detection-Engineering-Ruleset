title: Suspicious LSA Authentication Package Modification via Registry Set (AN0287-A)
id: 6728dda2-dbba-4712-8faa-94eac97e9fa2
status: experimental
description: Detects modifications to the LSA Authentication, Notification, or Security Packages registry keys, indicating the potential installation of a malicious password filter DLL or authentication bypass.
author: Krishna Gupta
date: 2026-06-12
logsource:
    category: registry_set
    product: windows
detection:
    selection_target:
        TargetObject|contains:
            - '\CurrentControlSet\Control\Lsa\Authentication Packages'
            - '\CurrentControlSet\Control\Lsa\Notification Packages'
            - '\CurrentControlSet\Control\Lsa\Security Packages'
            - '\CurrentControlSet\Control\Lsa\OSConfig\Security Packages'
    filter_system:
        Image|endswith:
            - '\lsass.exe'
            - '\services.exe'
    condition: selection_target and not filter_system
fields:
    - TargetObject
    - Image
    - Details
    - User
falsepositives:
    - Legitimate installation of enterprise identity and access management (IAM) software.
    - Deployment of organizational password synchronization utilities.
level: critical
tags:
    - attack.credential-access
    - attack.defense-evasion
    - attack.persistence
    - attack.t1556
    - attack.t1556.002
    - analytic.an0287
    - detection.det0104
