title: Registry Modification CLI for UAC Bypass (AN1094)
id: ba80f434-79c2-4f7a-962d-69d3f490e5ce
status: experimental
description: Detects command-line registry modifications targeting UAC auto-elevation registry paths such as isolatedCommand, DelegateExecute, or shell\open\command keys under the user hive.
author: Krishna Gupta
date: 2026-06-07
logsource:
    category: process_creation
    product: windows
detection:
    selection_cmd:
        CommandLine|contains:
            - '\shell\open\command'
            - '\isolatedCommand'
            - '\DelegateExecute'
        CommandLine|contains:
            - 'reg'
            - 'add'
            - 'Set-ItemProperty'
            - 'New-ItemProperty'
            - 'setx'
    condition: selection_cmd
fields:
    - Image
    - OriginalFileName
    - CommandLine
    - ParentImage
    - ParentCommandLine
    - CurrentDirectory
    - User
    - LogonId
falsepositives:
    - Legitimate installers or administration scripts executing setup tasks.
level: high
tags:
    - attack.privilege-escalation
    - attack.defense-evasion
    - attack.t1548.002
    - analytic.an1094
    - detection.det0388
