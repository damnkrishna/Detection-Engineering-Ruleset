title: Local and Domain Group Discovery (AN2082)
id: fa896a52-a175-4ce0-ad9f-518ae414adae
status: experimental
description: Detects command-line utilities querying local or domain administrative groups. Covers renamed binaries via OriginalFileName to resist trivial binary-rename evasion.
author: Krishna Gupta
date: 2026-06-30
logsource:
    category: process_creation
    product: windows
detection:
    selection_images:
        Image|endswith:
            - '\net.exe'
            - '\net1.exe'
            - '\dsquery.exe'
    selection_ofn:
        OriginalFileName:
            - 'net.exe'
            - 'net1.exe'
            - 'dsquery.exe'
    selection_cli:
        CommandLine|contains:
            - ' localgroup'
            - ' group '
    selection_targets:
        CommandLine|contains:
            - 'administrators'
            - 'domain admins'
            - 'enterprise admins'
    condition: (selection_images or selection_ofn) and selection_cli and selection_targets
fields:
    - Image
    - OriginalFileName
    - CommandLine
    - User
falsepositives:
    - Auditors or identity management software assessing group memberships.
level: medium
tags:
    - attack.discovery
    - attack.t1069
    - analytic.an2082
    - detection.det0939
