title: SMB Share and Session Discovery (AN2081)
id: eddafafb-530b-41c4-ae37-7fa68eb4e4d7
status: experimental
description: Detects command-line execution querying active network sessions or mapped drives. Covers renamed net.exe via OriginalFileName to resist trivial binary-rename evasion.
author: Krishna Gupta
date: 2026-06-30
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\net.exe'
            - '\net1.exe'
    selection_ofn:
        OriginalFileName:
            - 'net.exe'
            - 'net1.exe'
    selection_cli:
        CommandLine|contains:
            - ' use'
            - ' session'
    condition: (selection_image or selection_ofn) and selection_cli
fields:
    - Image
    - OriginalFileName
    - CommandLine
    - User
falsepositives:
    - Logon scripts mapping network drives automatically for users.
level: low
tags:
    - attack.discovery
    - attack.t1049
    - analytic.an2081
    - detection.det0938
