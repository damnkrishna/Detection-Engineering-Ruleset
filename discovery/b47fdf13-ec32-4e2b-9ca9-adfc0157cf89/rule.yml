title: Application Window Enumeration via CLI (AN0271-B)
id: 4e496d86-0cc9-4aad-8529-87969a75ff67
status: experimental
description: Detects command-line arguments referencing Win32 API window enumeration functions, which indicates process execution attempting to inspect application windows.
author: Krishna Gupta
date: 2026-06-08
logsource:
    category: process_creation
    product: windows
    # Relies on Sysmon Event ID 1
detection:
    selection_process:
        - Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\cmd.exe'
        - OriginalFileName:
            - 'PowerShell.EXE'
            - 'pwsh.dll'
            - 'wscript.exe'
            - 'cscript.exe'
            - 'Cmd.Exe'
    selection_keywords:
        CommandLine|contains:
            - 'EnumWindows'
            - 'GetForegroundWindow'
            - 'GetWindowText'
            - 'FindWindow'
    condition: selection_process and selection_keywords
fields:
    - Image
    - OriginalFileName
    - CommandLine
    - ParentImage
    - User
falsepositives:
    - Legitimate administration scripts or automation tools.
level: medium
tags:
    - attack.discovery
    - attack.t1010
    - analytic.an0271
    - detection.det0097
