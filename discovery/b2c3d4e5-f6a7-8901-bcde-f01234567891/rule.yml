title: System Locale and Keyboard Layout Discovery (AN2088)
id: 5d6e55d4-a87e-4b35-8fdb-e866a8844bf4
status: experimental
description: Detects command-line queries of Windows locale, keyboard layout, or timezone registry keys used to determine system geographic location. Covers renamed binaries via OriginalFileName to resist trivial binary-rename evasion.
author: Krishna Gupta
date: 2026-07-01
logsource:
    category: process_creation
    product: windows
detection:
    selection_reg:
        Image|endswith:
            - '\reg.exe'
    selection_reg_ofn:
        OriginalFileName: 'reg.exe'
    selection_reg_cli:
        CommandLine|contains:
            - 'International'
            - 'Keyboard Layout'
            - 'TimeZoneInformation'
    selection_ps:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_ps_ofn:
        OriginalFileName:
            - 'PowerShell.EXE'
            - 'pwsh.exe'
    selection_ps_cli:
        CommandLine|contains:
            - 'Get-Culture'
            - 'Get-WinSystemLocale'
            - 'CurrentCulture'
            - 'TimeZone'
    selection_wmic:
        Image|endswith:
            - '\wmic.exe'
    selection_wmic_ofn:
        OriginalFileName: 'wmic.exe'
    selection_wmic_cli:
        CommandLine|contains:
            - 'os get locale'
    condition: ((selection_reg or selection_reg_ofn) and selection_reg_cli) or ((selection_ps or selection_ps_ofn) and selection_ps_cli) or ((selection_wmic or selection_wmic_ofn) and selection_wmic_cli)
fields:
    - Image
    - OriginalFileName
    - CommandLine
    - User
falsepositives:
    - Application installers configuring locale-specific defaults.
level: low
tags:
    - attack.discovery
    - attack.t1614
    - analytic.an2088
    - detection.det0945
