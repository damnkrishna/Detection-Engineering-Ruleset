title: Registry Query for Sensitive Configurations (AN2077)
id: 00c0eeae-f3c0-4347-a1e6-f878f8ad0480
status: experimental
description: Detects command-line queries of the Windows Registry for LSA providers, Autoruns, or SAM information. Covers renamed reg.exe via OriginalFileName to resist trivial binary-rename evasion.
author: Krishna Gupta
date: 2026-06-30
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\reg.exe'
    selection_ofn:
        OriginalFileName: 'reg.exe'
    selection_action:
        CommandLine|contains:
            - ' query '
    selection_hives:
        CommandLine|contains:
            - 'LSA'
            - 'SecurityProviders'
            - 'CurrentVersion\Run'
            - 'SAM\Domains'
    condition: (selection_image or selection_ofn) and selection_action and selection_hives
fields:
    - Image
    - OriginalFileName
    - CommandLine
    - User
falsepositives:
    - Administrative scripts verifying security configurations or startup items.
level: medium
tags:
    - attack.discovery
    - attack.t1012
    - analytic.an2077
    - detection.det0934
