title: Suspicious Lua Script Execution (AN0278)
id: 9073cc8f-0454-48de-ae5b-cc601d47fefb
status: experimental
description: Detects suspicious execution of Lua interpreters (lua.exe, luac.exe) spawned by web servers, office programs, or executing from user-writable paths.
author: Krishna Gupta
date: 2026-06-07
logsource:
    category: process_creation
    product: windows
    # Relies on Sysmon Event ID 1
detection:
    selection_images:
        - Image|endswith:
            - '\lua.exe'
            - '\luac.exe'
            - '\wlua.exe'
            - '\luajit.exe'
        - OriginalFileName:
            - 'lua.exe'
            - 'luac.exe'
            - 'wlua.exe'
            - 'luajit.exe'
    selection_suspicious_parents:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\outlook.exe'
            - '\w3wp.exe'
            - '\nginx.exe'
            - '\httpd.exe'
            - '\sqlservr.exe'
    selection_temp_paths:
        CommandLine|contains:
            - '\AppData\Local\Temp\'
            - '\Users\Public\'
            - '\Windows\Temp\'
            - '\AppData\Roaming\'
    condition: selection_images and (selection_suspicious_parents or selection_temp_paths)
fields:
    - Image
    - OriginalFileName
    - CommandLine
    - ParentImage
    - ParentCommandLine
    - CurrentDirectory
    - User
    - LogonId
falsepositives:
    - Development environments or legitimate applications utilizing embedded Lua scripting engines (e.g., Nmap scripts, Wireshark plugins).
level: high
tags:
    - attack.execution
    - attack.t1059.011
    - analytic.an0278
    - detection.det0101
