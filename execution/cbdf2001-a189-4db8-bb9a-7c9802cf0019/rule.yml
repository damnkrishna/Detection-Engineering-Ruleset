title: Service Controller CommandLine Creation (AN1185-B)
id: b76b423d-b7e4-4ff6-af3a-b8043eb948ea
status: experimental
description: Detects command-line parameters utilizing sc.exe or net.exe to create or modify service binaries.
author: Krishna Gupta
date: 2026-06-30
logsource:
    category: process_creation
    product: windows
detection:
    selection_images:
        Image|endswith:
            - '\sc.exe'
            - '\net.exe'
            - '\net1.exe'
    selection_orig:
        OriginalFileName:
            - 'sc.exe'
            - 'net.exe'
            - 'net1.exe'
    selection_cli:
        CommandLine|contains:
            - ' binpath='
            - ' create '
            - ' config '
    condition: (selection_images or selection_orig) and selection_cli
fields:
    - Image
    - CommandLine
    - User
falsepositives:
    - IT administration scripts registering trusted business applications or service paths.
level: medium
tags:
    - attack.execution
    - attack.t1569.002
    - analytic.an1185
    - detection.det0421
