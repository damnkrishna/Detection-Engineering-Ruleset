title: Lua Script File Drop in Temp Directories (AN0278-B)
id: 2525a3f8-3360-45b1-a38f-68fba065308c
status: experimental
description: Detects the creation of Lua script files (.lua) inside user-writable temp folders, indicating staging for execution.
author: Krishna Gupta
date: 2026-06-17
logsource:
    category: file_event
    product: windows
detection:
    selection_paths:
        TargetFilename|contains:
            - '\AppData\Local\Temp\'
            - '\Users\Public\'
            - '\Windows\Temp\'
    selection_extensions:
        TargetFilename|endswith:
            - '.lua'
    condition: selection_paths and selection_extensions
fields:
    - TargetFilename
    - Image
    - User
falsepositives:
    - Software installer routines unpacking helper scripts.
level: medium
tags:
    - attack.execution
    - attack.t1059.011
    - analytic.an0278
    - detection.det0101
