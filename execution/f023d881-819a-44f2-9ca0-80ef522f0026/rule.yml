title: Office Application Spawning Shell via DDE (AN1393-A)
id: 67e74e2d-8dd2-4c0f-9b84-50bbe2741b75
status: experimental
description: Detects Office binaries launching cmd/powershell shells, suggesting active DDE code execution.
author: Krishna Gupta
date: 2026-06-30
logsource:
    category: process_creation
    product: windows
detection:
    selection_parents:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
    selection_images:
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\mshta.exe'
            - '\wscript.exe'
            - '\cscript.exe'
    condition: selection_parents and selection_images
fields:
    - Image
    - CommandLine
    - ParentImage
    - User
falsepositives:
    - Automated document updates containing legacy administrative macros (uncommon).
level: critical
tags:
    - attack.execution
    - attack.t1559.002
    - analytic.an1393
    - detection.det0504
