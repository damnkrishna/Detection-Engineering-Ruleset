title: Scheduled Task Configuration File Creation (AN0258-B)
id: 41ecc8e0-cb06-4202-8bc9-11fee7819aa3
status: experimental
description: Detects the creation of scheduled task XML configuration files in the Windows System32 Tasks folder.
author: Krishna Gupta
date: 2026-06-17
logsource:
    category: file_event
    product: windows
detection:
    selection:
        TargetFilename|contains:
            - '\System32\Tasks\'
    condition: selection
fields:
    - TargetFilename
    - Image
    - User
falsepositives:
    - Authorized software installations setting up tasks.
level: medium
tags:
    - attack.execution
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1053.005
    - analytic.an0258
    - detection.det0094
