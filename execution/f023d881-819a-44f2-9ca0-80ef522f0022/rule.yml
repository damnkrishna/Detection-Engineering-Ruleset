title: Office Application Spawning Living-off-the-Land Binaries (AN1314-A)
id: 7844961b-5c59-4e95-8d88-0b2bad9e6a5e
status: experimental
description: Detects command shells or administrative LOLBINs spawned directly by Office or PDF viewer parent processes.
author: Krishna Gupta
date: 2026-06-30
logsource:
    category: process_creation
    product: windows
detection:
    selection_parents:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
            - '\acrord32.exe'
    selection_images:
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\mshta.exe'
            - '\msiexec.exe'
            - '\rundll32.exe'
            - '\cscript.exe'
            - '\wscript.exe'
            - '\regsvr32.exe'
    condition: selection_parents and selection_images
fields:
    - Image
    - CommandLine
    - ParentImage
    - User
falsepositives:
    - Office plugins or document helpers initiating authorized application integrations.
level: critical
tags:
    - attack.execution
    - attack.t1204
    - analytic.an1314
    - detection.det0478
