title: Unusual Script Host Parent Process (AN1428-B)
id: 1adc2c8d-f923-420f-8d28-bfddcf9a3246
status: experimental
description: Detects cscript.exe or wscript.exe processes spawned by unusual parent processes.
author: Krishna Gupta
date: 2026-06-30
logsource:
    category: process_creation
    product: windows
detection:
    selection_images:
        Image|endswith:
            - '\wscript.exe'
            - '\cscript.exe'
    selection_orig:
        OriginalFileName:
            - 'wscript.exe'
            - 'cscript.exe'
    selection_parents:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\chrome.exe'
            - '\msedge.exe'
            - '\w3wp.exe'
    condition: (selection_images or selection_orig) and selection_parents
fields:
    - Image
    - ParentImage
    - CommandLine
    - User
falsepositives:
    - Web services configured to spawn custom backend diagnostics (uncommon).
level: critical
tags:
    - attack.execution
    - attack.t1059
    - analytic.an1428
    - detection.det0516
