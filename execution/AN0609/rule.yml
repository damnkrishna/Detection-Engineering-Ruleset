title: Service Execution Flow Hijacking via CLI (AN0609)
id: 85592112-5aa7-4355-bdcb-7a7dd7cdcf72
status: experimental
description: Detects command-line service modifications or registry additions that alter the execution flow of system services (such as modifying service binPath or adding custom ServiceDlls).
author: Krishna Gupta
date: 2026-06-07
logsource:
    category: process_creation
    product: windows
detection:
    selection_sc:
        - Image|endswith: '\sc.exe'
        - OriginalFileName: 'sc.exe'
    selection_sc_args:
        CommandLine|contains|all:
            - 'config'
            - 'binpath'
    selection_reg:
        - Image|endswith:
            - '\reg.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
        - OriginalFileName:
            - 'reg.exe'
            - 'PowerShell.EXE'
            - 'pwsh.dll'
    selection_reg_args:
        CommandLine|contains|all:
            - 'System\CurrentControlSet\Services'
            - 'add'
        CommandLine|contains:
            - 'ImagePath'
            - 'ServiceDll'
    condition: (selection_sc and selection_sc_args) or (selection_reg and selection_reg_args)
fields:
    - Image
    - OriginalFileName
    - CommandLine
    - ParentImage
    - ParentCommandLine
    - CurrentDirectory
    - User
    - LogonId
falsepositives:
    - Legitimate software installers configuring service binary paths during application deployment.
level: high
tags:
    - attack.execution
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1574
    - analytic.an0609
    - detection.det0218
