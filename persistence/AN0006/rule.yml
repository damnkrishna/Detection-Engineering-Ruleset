title: Domain Account Creation via CLI (AN0006)
id: 909c5e32-b7e0-4795-bc2f-0101bf95ef3e
status: experimental
description: Detects creation of new domain user accounts via net user /add /domain or PowerShell New-ADUser, which may indicate adversarial persistence.
author: Krishna Gupta
date: 2026-06-07
logsource:
    category: process_creation
    product: windows
detection:
    selection_net:
        - Image|endswith: '\net.exe'
        - OriginalFileName: 'net.exe'
    selection_net_args:
        CommandLine|contains:
            - ' user '
            - ' /add '
            - ' /domain'
    selection_powershell:
        - Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        - OriginalFileName:
            - 'PowerShell.EXE'
            - 'pwsh.dll'
    selection_ps_args:
        CommandLine|contains:
            - 'New-ADUser'
            - 'New-LocalUser'
    filter_installer:
        ParentImage|endswith:
            - '\msiexec.exe'
            - '\setup.exe'
    condition: ((selection_net and selection_net_args) or (selection_powershell and selection_ps_args)) and not filter_installer
fields:
    - Image
    - OriginalFileName
    - CommandLine
    - ParentImage
    - ParentCommandLine
    - CurrentDirectory
    - User
    - LogonId
falsepositives:
    - IT administrators creating domain accounts during onboarding.
level: high
tags:
    - attack.persistence
    - attack.t1136.002
    - analytic.an0006
    - detection.det0003
