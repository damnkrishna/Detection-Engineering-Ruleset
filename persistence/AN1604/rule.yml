title: 'AN1604 - Generic Create Account'
id: 80b1c6e0-acfd-4271-806b-b8dbd3f659c3
status: experimental
description: 'Detects the usage of net.exe to add a new user account, which may indicate an adversary establishing persistence.'
author: Krishna Gupta
logsource:
  product: windows
  category: process_creation
detection:
  selection_image:
    Image|endswith:
      - '\net.exe'
      - '\net1.exe'
  selection_cmd:
    CommandLine|contains|all:
      - ' user '
      - ' /add'
  condition: selection_image and selection_cmd
fields:
  - EventID
  - Image
  - CommandLine
  - ParentImage
level: high
tags:
  - attack.persistence
  - attack.t1136
  - analytic.an1604
