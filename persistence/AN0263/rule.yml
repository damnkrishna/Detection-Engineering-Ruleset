title: 'AN0263 - Office Application Startup: Outlook Rules'
id: ba407ee7-2882-457c-95c7-7d2c2ff07efa
status: experimental
description: 'Detects modifications to Microsoft Outlook Rules registry keys, potentially indicating the deployment of malicious rules for persistence or execution.'
author: Krishna Gupta
logsource:
  product: windows
  category: registry_set
detection:
  selection_registry:
    TargetObject|contains: '\Software\Microsoft\Office\'
    TargetObject|endswith: '\Outlook\Rules'
  selection_event:
    EventType: 'SetValue'
  condition: selection_registry and selection_event
fields:
  - EventID
  - TargetObject
  - Image
  - Details
level: high
tags:
  - attack.persistence
  - attack.t1137.005
  - analytic.an0263
