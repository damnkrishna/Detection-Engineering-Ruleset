title: 'AN0472 - Server Software Component: Transport Agent'
id: a106b01f-3beb-4933-9f5e-7576f9df61ef
status: experimental
description: 'Detects the execution of PowerShell commands used to install or enable Exchange Transport Agents, which adversaries abuse for persistence and data theft.'
author: Krishna Gupta
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'Install-TransportAgent'
      - 'Enable-TransportAgent'
  condition: selection
fields:
  - EventID
  - Image
  - CommandLine
  - ParentImage
level: critical
tags:
  - attack.persistence
  - attack.t1505.002
  - analytic.an0472
