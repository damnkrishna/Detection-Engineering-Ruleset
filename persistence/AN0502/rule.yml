title: 'AN0502 - Office Application Startup: Outlook Home Page'
id: 6c3585eb-3580-43a3-bc7e-3a551eaedbb3
status: experimental
description: 'Detects registry modifications targeting Outlook WebView or Home Page settings, indicative of potential persistence mechanisms.'
author: Krishna Gupta
logsource:
  product: windows
  category: registry_set
detection:
  selection_registry:
    TargetObject|contains: '\Outlook\WebView\'
  selection_event:
    EventType: 'SetValue'
  condition: selection_registry and selection_event
fields:
  - EventID
  - TargetObject
  - Image
  - Details
level: high
tags:
  - attack.persistence
  - attack.t1137.004
  - analytic.an0502
