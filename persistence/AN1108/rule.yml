title: 'AN1108 - Server Software Component: Web Shell'
id: e08d4587-55a9-4597-93dc-35acced24ed1
status: experimental
description: 'Detects web server processes spawning command shells, which is a strong indicator of web shell execution and persistence.'
author: Krishna Gupta
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith:
      - '\w3wp.exe'
      - '\httpd.exe'
      - '\nginx.exe'
      - '\tomcat.exe'
      - '\php-cgi.exe'
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\certutil.exe'
  condition: selection_parent and selection_child
fields:
  - EventID
  - ParentImage
  - Image
  - CommandLine
level: critical
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1505.003
  - analytic.an1108
