title: CLI Alternative Protocol Utility Execution (AN0367-B)
id: 4467acb0-f2ce-4c08-a2b1-851b911cb17f
status: experimental
description: Detects execution of standard command-line tools often utilized to transfer data over alternative protocols.
author: Krishna Gupta
date: 2026-06-17
logsource:
    category: process_creation
    product: windows
detection:
    selection_binaries_image:
        Image|endswith:
            - '\ftp.exe'
            - '\tftp.exe'
            - '\telnet.exe'
            - '\curl.exe'
            - '\wget.exe'
    selection_binaries_original:
        OriginalFileName:
            - 'ftp.exe'
            - 'tftp.exe'
            - 'telnet.exe'
            - 'curl.exe'
            - 'wget.exe'
    condition: selection_binaries_image or selection_binaries_original
fields:
    - Image
    - OriginalFileName
    - CommandLine
    - User
falsepositives:
    - Standard administrative tasks or legitimate software updates utilizing curl/wget.
level: medium
tags:
    - attack.exfiltration
    - attack.t1048
    - analytic.an0367
    - detection.det0131
