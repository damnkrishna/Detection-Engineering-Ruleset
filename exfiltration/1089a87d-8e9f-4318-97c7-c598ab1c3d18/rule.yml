title: Paste Site Exfiltration Command Execution (AN0787-B)
id: b5110e4c-a233-4cba-b57d-fe97b97aa006
status: experimental
description: Detects CLI tools or scripting engines executing commands that target known public paste bins, suggesting potential scripted data exfiltration.
author: Krishna Gupta
date: 2026-06-17
logsource:
    category: process_creation
    product: windows
detection:
    selection_process_image:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\curl.exe'
    selection_process_original:
        OriginalFileName:
            - 'PowerShell.EXE'
            - 'pwsh.dll'
            - 'cmd.exe'
            - 'wscript.exe'
            - 'cscript.exe'
            - 'curl.exe'
    selection_args:
        CommandLine|contains:
            - 'pastebin.com'
            - 'hastebin.com'
            - 'ghostbin.co'
            - 'paste.ee'
            - 'controlc.com'
    condition: (selection_process_image or selection_process_original) and selection_args
fields:
    - Image
    - OriginalFileName
    - CommandLine
    - User
falsepositives:
    - Administrative scripts retrieving software updates or configurations.
level: high
tags:
    - attack.exfiltration
    - attack.t1567.003
    - analytic.an0787
    - detection.det0284
