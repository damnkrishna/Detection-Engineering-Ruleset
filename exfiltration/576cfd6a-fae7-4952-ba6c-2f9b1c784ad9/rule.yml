title: CLI Copy Command Targeting Removable Media (AN0616-B)
id: 44b01c04-76b4-4a1b-a21d-6e4b3edab6fc
status: experimental
description: Detects command line copy utility executions specifying typical USB/removable storage drive letters.
author: Krishna Gupta
date: 2026-06-17
logsource:
    category: process_creation
    product: windows
detection:
    selection_process_image:
        Image|endswith:
            - '\xcopy.exe'
            - '\robocopy.exe'
            - '\powershell.exe'
            - '\cmd.exe'
    selection_process_original:
        OriginalFileName:
            - 'xcopy.exe'
            - 'robocopy.exe'
            - 'PowerShell.EXE'
            - 'cmd.exe'
    selection_paths:
        CommandLine|contains:
            - ' D:\'
            - ' E:\'
            - ' F:\'
            - ' G:\'
            - ' H:\'
            - ' I:\'
    condition: (selection_process_image or selection_process_original) and selection_paths
fields:
    - Image
    - OriginalFileName
    - CommandLine
    - User
falsepositives:
    - Administrative file management or users backing up personal files via command prompt.
level: medium
tags:
    - attack.exfiltration
    - attack.t1052.001
    - analytic.an0616
    - detection.det0220
