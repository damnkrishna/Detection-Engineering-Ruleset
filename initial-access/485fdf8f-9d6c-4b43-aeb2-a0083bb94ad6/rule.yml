title: Phishing - Suspicious Child Process Spawned by Mail Client (AN0188-A)
id: 44b65219-f86c-4078-9485-07817f87f30d
status: experimental
description: Detects suspicious child processes spawned by Microsoft Outlook or other common email clients, which indicates potential user execution of a malicious phishing attachment.
author: Krishna Gupta
date: 2026-06-08
logsource:
    category: process_creation
    product: windows
detection:
    selection_parent:
        ParentImage|endswith:
            - '\outlook.exe'
            - '\thunderbird.exe'
            - '\foxmail.exe'
    selection_child:
        - Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\mshta.exe'
            - '\rundll32.exe'
            - '\regsvr32.exe'
            - '\hh.exe'
            - '\bitsadmin.exe'
            - '\curl.exe'
        - OriginalFileName:
            - 'Cmd.Exe'
            - 'PowerShell.EXE'
            - 'wscript.exe'
            - 'cscript.exe'
            - 'mshta.exe'
            - 'rundll32.exe'
            - 'regsvr32.exe'
            - 'bitsadmin.exe'
            - 'curl.exe'
    condition: selection_parent and selection_child
fields:
    - Image
    - OriginalFileName
    - CommandLine
    - ParentImage
    - ParentCommandLine
    - CurrentDirectory
    - User
    - LogonId
falsepositives:
    - Office extensions or administrative tools executing command scripts for mail configuration or updates.
level: high
tags:
    - attack.initial-access
    - attack.t1566
    - analytic.an0188
    - detection.det0070
