title: Phishing - Suspicious File Attachment Written by Mail Client (AN0188-B)
id: 296361bc-a10a-4414-9a74-cc8643eaad6e
status: experimental
description: Detects email client software writing executable, script, or container file formats to disk, which suggests a user downloading a potentially malicious phishing attachment.
author: Krishna Gupta
date: 2026-06-16
logsource:
    category: file_event
    product: windows
detection:
    selection_parent:
        Image|endswith:
            - '\outlook.exe'
            - '\thunderbird.exe'
            - '\foxmail.exe'
    selection_file:
        TargetFilename|endswith:
            - '.exe'
            - '.lnk'
            - '.vbs'
            - '.hta'
            - '.iso'
            - '.img'
            - '.bat'
            - '.ps1'
            - '.scr'
            - '.zip'
    condition: selection_parent and selection_file
fields:
    - Image
    - TargetFilename
    - User
falsepositives:
    - Legitimate user downloading file attachments required for business purposes.
level: medium
tags:
    - attack.initial-access
    - attack.t1566
    - analytic.an0188
    - detection.det0070
