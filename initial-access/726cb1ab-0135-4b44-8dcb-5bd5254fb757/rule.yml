title: Hardware Supply Chain - Firmware Flashing Tool Execution (AN1035-A)
id: 62d1450e-e9e6-4b43-8ca2-a9d0490be8bc
status: experimental
description: Detects the execution of known firmware/BIOS flashing tools, which may indicate unauthorized BIOS/firmware modification.
author: Antigravity
date: 2026-06-12
logsource:
    category: process_creation
    product: windows
detection:
    selection_process:
        Image|endswith:
            - '\flashrom.exe'
            - '\fwupd.exe'
            - '\afuwingu.exe' # AMI Firmware Update Utility
            - '\HpbiosUpdate.exe'
            - '\DellBiosProvider.exe'
            - '\WinFlash.exe'
    condition: selection_process
fields:
    - Image
    - OriginalFileName
    - CommandLine
    - ParentImage
    - ParentCommandLine
    - CurrentDirectory
    - User
    - LogonId
falsepositives:
    - Authorized IT firmware upgrades or hardware maintenance tasks by technicians.
level: high
tags:
    - attack.initial-access
    - attack.t1195.003
    - analytic.an1035
    - detection.det0368
