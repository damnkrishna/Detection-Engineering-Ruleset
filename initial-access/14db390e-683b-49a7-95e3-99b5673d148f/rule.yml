title: Default Account Network Connection (AN1283-B)
id: 98a91ca5-f88f-4b7d-ab21-0d2d4b96591d
status: experimental
description: Detects network connections over remote admin ports (445, 3389, 5985) by shell processes, suggesting default account lateral movement activity.
author: Krishna Gupta
date: 2026-06-17
logsource:
    category: network_connection
    product: windows
detection:
    selection_ports:
        DestinationPort:
            - 445
            - 3389
            - 5985
            - 5986
    selection_process:
        - Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
    condition: selection_ports and selection_process
fields:
    - Image
    - SourceIp
    - DestinationIp
    - DestinationPort
    - User
falsepositives:
    - Standard admin scripts performing remote management.
level: medium
tags:
    - attack.initial-access
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1078.001
    - analytic.an1283
    - detection.det0350
