title: Spearphishing Link - Browser Spawned by Mail/Chat App with Suspicious URL (AN0298-A)
id: 4e2cfa21-c8b6-43c1-b1e9-c1fd1ba089c4
status: experimental
description: Detects default web browsers spawned by email clients or collaboration apps (Outlook, Teams, Discord, Slack) containing command-line arguments that reference direct file shares (e.g., file://, UNC paths) or suspicious downloadable file extensions.
author: Krishna Gupta
date: 2026-06-08
logsource:
    category: process_creation
    product: windows
detection:
    selection_parent:
        ParentImage|endswith:
            - '\outlook.exe'
            - '\thunderbird.exe'
            - '\teams.exe'
            - '\slack.exe'
            - '\discord.exe'
            - '\Telegram.exe'
    selection_browser:
        Image|endswith:
            - '\chrome.exe'
            - '\msedge.exe'
            - '\firefox.exe'
            - '\brave.exe'
            - '\opera.exe'
    selection_args:
        CommandLine|contains:
            - 'file://'
            - '\\\\' # UNC path
            - '.zip'
            - '.iso'
            - '.img'
            - '.lnk'
            - '.bat'
            - '.cmd'
            - '.vbs'
            - '.exe'
            - '.scr'
    condition: selection_parent and selection_browser and selection_args
fields:
    - Image
    - OriginalFileName
    - CommandLine
    - ParentImage
    - ParentCommandLine
    - CurrentDirectory
    - User
    - LogonId
falsepositives:
    - Users clicking links in emails to download legitimate company files hosted on internal file servers or official repositories.
level: medium
tags:
    - attack.initial-access
    - attack.t1566.002
    - analytic.an0298
    - detection.det0107
