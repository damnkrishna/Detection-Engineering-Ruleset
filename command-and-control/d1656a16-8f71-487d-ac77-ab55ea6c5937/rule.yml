title: Ingress Tool Transfer Network Connection (AN0165-C)
id: 4127cce9-13b5-4023-a50a-af16d634f4ca
status: experimental
description: Detects outbound network connections initiated by common command line download tools (certutil, bitsadmin, curl, wget, PowerShell) to remote web ports, indicating active ingress downloads.
author: Krishna Gupta
date: 2026-06-08
logsource:
    category: network_connection
    product: windows
    # Relies on Sysmon Event ID 3
detection:
    selection_process:
        Image|endswith:
            - '\certutil.exe'
            - '\bitsadmin.exe'
            - '\curl.exe'
            - '\wget.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_ports:
        DestinationPort:
            - 80
            - 443
            - 8080
    condition: selection_process and selection_ports
fields:
    - Image
    - CommandLine
    - User
    - DestinationHostname
    - DestinationIp
    - DestinationPort
    - Initiated
    - SourceIp
falsepositives:
    - Legitimate administrative operations downloading files from internal/external servers.
level: high
tags:
    - attack.command-and-control
    - attack.t1105
    - analytic.an0165
    - detection.det0060
