title: Lateral Movement - Deployment Agent Spawning Suspicious Shell (AN0623)
id: 598295b9-9061-458c-8c2a-79e8e9d58f69
status: experimental
description: Detects software deployment agent processes (such as SCCM, PDQ Deploy, Altiris) spawning command-line interpreters or script hosts, indicating potential lateral movement or deployment abuse.
author: Krishna Gupta
date: 2026-06-08
logsource:
    category: process_creation
    product: windows
detection:
    selection_parent:
        ParentImage|endswith:
            - '\CcmExec.exe' # SCCM Agent
            - '\PDQDeployService.exe' # PDQ Deploy
            - '\PDQDeployConsole.exe'
            - '\AeXNSAgent.exe' # Symantec/Altiris Agent
            - '\gpscript.exe' # Group Policy Script wrapper
    selection_child:
        - Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\mshta.exe'
        - OriginalFileName:
            - 'Cmd.Exe'
            - 'PowerShell.EXE'
            - 'wscript.exe'
            - 'cscript.exe'
            - 'mshta.exe'
    filter_installer:
        ParentImage|endswith:
            - '\msiexec.exe'
            - '\setup.exe'
    condition: selection_parent and selection_child and not filter_installer
fields:
    - Image
    - OriginalFileName
    - CommandLine
    - ParentImage
    - ParentCommandLine
    - CurrentDirectory
    - User
    - LogonId
falsepositives:
    - Legitimate software setup scripts or administrative maintenance tasks triggered via Group Policy or corporate SCCM packages.
level: medium
tags:
    - attack.lateral-movement
    - attack.t1072
    - analytic.an0623
    - detection.det0223
