title: Lateral Movement - WinRM Host Spawning Command Shell (AN1313)
id: 1170dc8d-8f62-48b0-beae-f123b7df68e7
status: experimental
description: Detects the Windows Remote Management provider host (wsmprovhost.exe) spawning command interpreters (cmd.exe, powershell.exe), indicating active WinRM remote command execution.
author: Krishna Gupta
date: 2026-06-08
logsource:
    category: process_creation
    product: windows
detection:
    selection_parent:
        ParentImage|endswith:
            - '\wsmprovhost.exe'
    selection_child:
        - Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
        - OriginalFileName:
            - 'Cmd.Exe'
            - 'PowerShell.EXE'
    filter_installer:
        ParentImage|endswith:
            - '\msiexec.exe'
            - '\setup.exe'
    condition: selection_parent and selection_child and not filter_installer
fields:
    - Image
    - OriginalFileName
    - CommandLine
    - ParentImage
    - ParentCommandLine
    - CurrentDirectory
    - User
    - LogonId
falsepositives:
    - Legitimate remote administration or scripting tasks executed by IT support engineers using remote PowerShell.
level: medium
tags:
    - attack.lateral-movement
    - attack.t1021.006
    - analytic.an1313
    - detection.det0477
