title: Pass the Ticket Kerberos Command Line (AN1000)
id: e4cb9fca-5c7d-4e0a-b370-604ddde6161a
status: experimental
description: Detects process executions containing command arguments associated with Kerberos ticket injection (Rubeus, Mimikatz).
author: Krishna Gupta
date: 2026-06-08
logsource:
    category: process_creation
    product: windows
detection:
    selection_tools:
        CommandLine|contains:
            - 'ptt ' # Pass the ticket
            - 'asktgt '
            - 'createnetonly'
            - 'kerberos::ptt'
    condition: selection_tools
fields:
    - Image
    - CommandLine
    - User
falsepositives:
    - Red team testing or authorized security auditing.
level: high
tags:
    - attack.lateral-movement
    - attack.t1550.003
    - analytic.an1000
    - detection.det0352
