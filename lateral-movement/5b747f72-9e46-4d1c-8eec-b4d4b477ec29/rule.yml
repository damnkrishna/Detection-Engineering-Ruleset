title: LSASS Process Access for Credential Replay (AN1144-B)
id: 5cd81da8-6631-45ba-969b-f10749bd4c83
status: experimental
description: Detects command-line execution targeting LSASS process memory dump or credential harvesting tools (e.g. Mimikatz sekurlsa commands), indicating credential replay preparation.
author: Krishna Gupta
date: 2026-06-16
logsource:
    category: process_creation
    product: windows
detection:
    selection_cmd:
        CommandLine|contains:
            - 'sekurlsa'
            - 'lsass'
            - 'procdump'
            - 'rundll32.exe comsvcs.dll'
    condition: selection_cmd
fields:
    - Image
    - CommandLine
    - User
falsepositives:
    - Authorized administrative troubleshooting or security audits.
level: high
tags:
    - attack.lateral-movement
    - attack.t1550.002
    - analytic.an1144
    - detection.det0409
