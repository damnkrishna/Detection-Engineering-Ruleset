title: File and Directory Permissions Modification (AN1177)
id: 31fe9877-a636-499b-9a1b-ceabd187255b
status: experimental
description: Detects the execution of permission-modifying utilities with suspicious parameters indicating privilege escalation intent.
author: Krishna Gupta
date: 2026-06-09
logsource:
    category: process_creation
    product: windows
    # Relies on Sysmon Event ID 1
detection:
    selection_tools:
        Image|endswith:
            - '\icacls.exe'
            - '\takeown.exe'
            - '\cacls.exe'
    selection_args:
        CommandLine|contains:
            - '/grant'
            - '/takeown'
            - 'Set-Acl'
            - 'Everyone:F'
    condition: selection_tools and selection_args
fields:
    - Image
    - OriginalFileName
    - CommandLine
    - ParentImage
    - ParentCommandLine
    - CurrentDirectory
    - User
    - LogonId
falsepositives:
    - System administrators managing file shares or restoring backups.
    - Software installers configuring application directories.
level: medium
tags:
    - attack.defense-evasion
    - attack.t1222.001
    - analytic.an1177
    - detection.det0418
