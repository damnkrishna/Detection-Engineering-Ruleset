title: Suspicious Electron Library Load (AN0071-B)
id: ddd9ac1d-7091-414d-97e1-6f8f1dc469fa
status: experimental
description: Detects the loading of node.dll or electron.dll by unexpected processes or from non-standard directories, which may indicate payload execution proxying.
author: Krishna Gupta
date: 2026-06-08
logsource:
    category: image_load
    product: windows
    # Relies on Sysmon Event ID 7
detection:
    selection_dll:
        ImageLoaded|endswith:
            - '\node.dll'
            - '\electron.dll'
    filter_legitimate:
        Image|endswith:
            - '\chrome.exe'
            - '\msedge.exe'
            - '\slack.exe'
            - '\Teams.exe'
            - '\Code.exe'
            - '\discord.exe'
            - '\explorer.exe'
    condition: selection_dll and not filter_legitimate
fields:
    - Image
    - ImageLoaded
    - Signed
    - SignatureStatus
falsepositives:
    - Other legitimate node/electron-based apps installed in the environment that are not in the filter list.
level: medium
tags:
    - attack.defense-evasion
    - attack.t1218.015
    - analytic.an0071
    - detection.det0025
