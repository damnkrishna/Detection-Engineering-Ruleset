title: DHCP Spoofing Tool Execution (AN1290-A)
id: ad4382b8-7b78-495e-ab36-57329546e530
status: experimental
description: Detects command-line execution of DHCP starvation or spoofing tools like Yersinia.
author: Krishna Gupta
date: 2026-06-30
logsource:
    category: process_creation
    product: windows
detection:
    selection_images:
        Image|endswith:
            - '\yersinia.exe'
            - '\dhcpstarv.exe'
        OriginalFileName:
            - 'yersinia.exe'
            - 'dhcpstarv.exe'
    selection_cli:
        CommandLine|contains:
            - 'yersinia'
            - 'dhcpstarv'
            - 'dhcp.spoof'
    filter_installers:
        ParentImage|endswith:
            - '\msiexec.exe'
            - '\setup.exe'
    condition: (selection_images or selection_cli) and not filter_installers
fields:
    - Image
    - OriginalFileName
    - CommandLine
    - User
falsepositives:
    - Network engineering diagnostics or vulnerability scans.
level: high
tags:
    - attack.collection
    - attack.t1557.003
    - analytic.an1290
    - detection.det0468
